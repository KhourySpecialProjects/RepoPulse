#remove all ports, only really needed for local host dev
#remove bind mounts, they link sync to host files, but should all be there in production
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite inlines VITE_* at build time, so this must be a build arg: the
      # image is a static bundle served by nginx, and a container environment
      # variable would never reach it. Phoenix runs on the repopulse network,
      # so the browser cannot reach it by service name; this is the address a
      # reader's browser can resolve.
      args:
        - VITE_PHOENIX_URL=https://phoenix.repopulse.cs4535.cloud/projects?timeRangeKey=7d
    environment:
      # Where nginx forwards /api; unset, the `backend` service. A Coolify
      # preview renames its services (backend-pr-<n>) but shares this
      # deployment's network, where `backend` is the main deployment's backend
      # — so in Coolify's *preview* environment variables set
      # API_PROXY_TARGET=http://backend-pr-<n>:8000. Read at container start by
      # frontend/nginx.conf.template.
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://backend:8000}
    depends_on:
      - backend
    networks:
      - repopulse

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - repo_clones:/repos
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    networks:
      - repopulse

  phoenix:
    image: arizephoenix/phoenix:latest
    volumes:
      - phoenix_data:/root/.phoenix
    networks:
      - repopulse

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repopulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]  #change from - to [,]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - repopulse

volumes:
  postgres_data: #remove null name
  phoenix_data: #remove null name
  repo_clones:

networks:
  repopulse:
    driver: bridge
