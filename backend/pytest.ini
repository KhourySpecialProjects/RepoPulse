[pytest]
asyncio_mode = auto

# Fixtures must share the test's event loop. pytest-asyncio 0.24 runs test
# functions in a function-scoped loop, so leaving fixtures at session scope put
# the DB engine and the test body in different loops — see conftest.py.
# The one fixture that genuinely needs a session loop sets loop_scope itself.
asyncio_default_fixture_loop_scope = function

# Only collect this project's own tests. Student repos are cloned into the
# container's working tree and carry their own test suites with their own
# dependencies — without this, pytest tries to import them and a single
# ModuleNotFoundError aborts the entire run at collection time.
testpaths = tests
norecursedirs = seed-repos repos .git node_modules *.egg-info

# The commit-classifier eval measures prompt accuracy against a hand-labeled
# fixture, which means a real API call per batch — money, latency, and a key
# the default `make test-backend` run does not have. Deselected here; run it
# deliberately with `pytest -m llm`, which overrides the -m below.
markers =
    llm: hits a real LLM API; deselected by default (run with -m llm and a real key)

# --strict-markers turns a mistyped marker into a collection error instead of a
# test that silently never runs.
addopts = -m "not llm" --strict-markers
